# RESEARCH profile: about 100K accounts over 90 days (min_instances: 0, so prevalence follows the quota only).
# max_instances is sized per family from the average instance size so that the 1% quota (about 100 member
# accounts per family) is reachable: small-instance families (1 to 3 members) need 60 to 120 instances.
# Recruitment cells: 5 x 40 + 2 x 120 + 3 x 60 = 620; eligible_share 0.15 gives about 24 candidates per cell.
# (First attempt with 40 for every family failed loudly: pass_through reached 40 instances with 65 of 100 members.)
population: {n_persons: 100000}
recruitment: {eligible_share: 0.15, max_shortfall_share: 0.2}
family_defaults: {max_instances: 40, min_instances: 0}
scenarios:
  pass_through: {max_instances: 120}
  account_to_cash: {max_instances: 120}
  structuring_like: {max_instances: 60}
  dormant_activation: {max_instances: 60}
  fan_in: {max_instances: 60}
