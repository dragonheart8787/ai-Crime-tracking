[project]
name = "fcip"
version = "0.1.0"
description = "Predictive Financial Crime Intelligence Platform: defensive research on synthetic transaction data"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.1",
    "pyarrow>=18",
    "polars>=1.20",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",   # Milestone 1: non-triviality probes and average precision only
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
fcip = "fcip.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fcip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "slow: tests that generate a full DEV dataset or spawn subprocesses",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length of code is enforced by `ruff format` (110); long strings and docstrings are allowed

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
